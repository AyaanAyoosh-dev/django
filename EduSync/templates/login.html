<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduSync Portal Authentication</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; color: #f8fafc; }
        .login-box { background: rgba(30, 41, 59, 0.7); padding: 40px; border-radius: 16px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); width: 360px; backdrop-filter: blur(12px); }
        h1 { text-align: center; color: #38bdf8; font-size: 1.8em; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 0.9em; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85em; margin-bottom: 6px; color: #cbd5e1; font-weight: 600; letter-spacing: 0.5px; }
        input { width: 100%; width: -webkit-fill-available; padding: 12px 16px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: white; font-size: 0.95em; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { border: none; width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border-radius: 8px; font-weight: 700; font-size: 1em; cursor: pointer; transition: background-color 0.2s; margin-top: 10px; }
        button:hover { background-color: #7dd3fc; }
        .error-banner { background: rgba(239, 68, 68, 0.2); border-left: 4px solid #ef4444; color: #fca5a5; padding: 12px; font-size: 0.85em; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <!-- Inside your original login.html file, change the h1 area to this: -->
  <div class="login-box">
    <h1>🏫 EduSync Hub</h1>
    <!-- This variable updates dynamically depending on the selected card block -->
    <p class="subtitle">{{ role_title }}</p>
    
    {% if error %}
    <div class="error-banner">⚠️ {{ error }}</div>
    {% endif %}
    
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>PORTAL ACCOUNT USERNAME</label>
            <input type="text" name="username" placeholder="Enter username..." required autocomplete="off">
        </div>
        <div class="form-group">
            <label>SECURITY PORTAL PASSWORD</label>
            <input type="password" name="password" placeholder="••••••••••••" required>
        </div>
        <button type="submit">Authenticate Session</button>
    </form>
  </div>

</body>
</html>
